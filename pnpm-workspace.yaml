# Security note (2026-06):
# The allowlists below exist to reduce supply-chain attack surface.
# - onlyBuiltDependencies / allowBuilds: only these packages are allowed to run
#   lifecycle scripts (postinstall, prepare, etc.) during `pnpm install`.
# - Any addition to this list MUST be reviewed for:
#     * Native code / node-gyp usage
#     * Obfuscated or remote-executing postinstall scripts
#     * Whether the package is truly required at install time
# See docs/plans/security-hardening-2026-06.md (P2) and SECURITY.md.

packages:
  - "packages/*"
  - "apps/*"
  - "website"
overrides:
  # dompurify <=3.4.10: ALLOWED_ATTR pollution via setConfig (GHSA-cmwh-pvxp-8882).
  # dompurify <=3.4.12: IN_PLACE hook removal leaves a detached subtree
  # executable -> XSS (GHSA-55q2-fjhq-7xh7). Patched in 3.4.13.
  # Pulled in transitively by monaco-editor (webui).
  dompurify: ">=3.4.13"
  # sharp <0.35.0 libvips vulnerabilities (GHSA-f88m-g3jw-g9cj)
  sharp: ">=0.35.0"
  # ai-gateway-provider@4.0.0 still declares its unused optional OpenRouter
  # adapter as 2.x (AI SDK 6). Keep the optional package on its AI SDK 7 line
  # so installing Cloudflare support does not leave an invalid peer graph.
  "@openrouter/ai-sdk-provider": "3.0.0"
  wrongstack: link:apps/wrongstack
peerDependencyRules:
  # TypeScript 7 was released before i18next/react-i18next widened their peer
  # ranges. WrongStack's WebUI passes its TS7 typecheck; allow this known lag.
  allowedVersions:
    "i18next>typescript": "7"
    "react-i18next>typescript": "7"
# GHSA-gv7w-rqvm-qjhr: esbuild "missing binary integrity verification" applies
# only to esbuild's DENO installer path; we consume esbuild directly and via
# Vite/Vitest on Node. Remove once the advisory no longer applies to our range.
auditConfig:
  ignoreGhsas:
    - GHSA-gv7w-rqvm-qjhr
allowBuilds:
  # electron-winstaller: arrives transitively with electron-builder (desktop
  # packaging). Its `install` script (`script/select-7z-arch.js`) copies the
  # 7-Zip executable and DLL for the HOST architecture out of the package's own
  # bundled `vendor/` directory — `vendor/7z-x64.exe` -> `vendor/7z.exe`. It
  # downloads nothing and executes nothing remote; both candidates ship inside
  # the tarball. Reviewed 2026-09-09 against 5.4.0.
  #
  # Only the Squirrel.Windows target consumes those binaries and we build NSIS
  # and portable, so this authorises a script whose OUTPUT we do not use. It is
  # here because pnpm 12 does not warn about an unapproved lifecycle script —
  # it fails `install` outright with ERR_PNPM_IGNORED_BUILDS, so the repo
  # cannot be installed at all while electron-builder is a dependency and this
  # entry is absent. Measured, not assumed: removing it breaks `pnpm install`.
  electron-winstaller: true
  esbuild: true
  # node-pty is an optional WebUI terminal dependency (used by the
  # integrated shell panel). We allow its prebuild-install script so the
  # package can fetch a Node-ABI-matching native binary from the
  # node-pty GitHub releases on install; this avoids forcing every
  # contributor to install MSVC + Python just to run the WebUI.
  # The script only downloads binaries published by microsoft/node-pty;
  # it does not execute arbitrary remote code.
  node-pty: true
  # sharp: removed in 2026-09-07 cleanup. The installed `sharp`
  # package no longer declares an install lifecycle script, so the
  # entry was a dead authorisation that would have re-armed the
  # gate silently if sharp ever gained a postinstall. The sibling
  # architecture test (`build-allowlist-freshness.test.ts`) prevents
  # this from coming back.
onlyBuiltDependencies:
  - electron-winstaller
  - esbuild
  - node-pty
# Install cooldown: refuse versions published less than 24h ago. This is the
# single most effective defence against a compromised-maintainer / npm account
# takeover, where a malicious version is published and yanked within hours.
# `minimumReleaseAgeExclude` below was already present but had nothing to
# exclude from — the cooldown itself was never defined (WS-039).
minimumReleaseAge: 1440
# Each entry here is a standing hole in that cooldown, so it is only
# acceptable while it is doing a job. Three entries (electron@43.0.0,
# ai@7.0.73, @ai-sdk/gateway@4.0.59) had outlived the versions they were
# written for — the lockfile had moved to 43.6.0 / 7.0.77 / 4.0.62 — so they
# authorised nothing anyone needed while waiting for those exact version
# strings to reappear and skip the delay with no review. Removed 2026-09-10
# and pinned by `build-allowlist-freshness.test.ts`, which now fails on a
# stale entry the way it already did for `allowBuilds`.
minimumReleaseAgeExclude:
  - "@agentclientprotocol/sdk@1.4.0"
  - "@datadog/pprof@5.18.1"
patchedDependencies: { ink@7.1.1: patches/ink@7.1.1.patch }
