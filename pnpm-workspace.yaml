# Security note (2026-06):
# The allowlists below exist to reduce supply-chain attack surface.
# - onlyBuiltDependencies / allowBuilds: only these packages are allowed to run
#   lifecycle scripts (postinstall, prepare, etc.) during `pnpm install`.
# - Any addition to this list MUST be reviewed for:
#     * Native code / node-gyp usage
#     * Obfuscated or remote-executing postinstall scripts
#     * Whether the package is truly required at install time
# See docs/plans/security-hardening-2026-06.md (P2) and SECURITY.md.

packages:
  - "packages/*"
  - "apps/*"
  - "website"
overrides:
  # dompurify <=3.4.10: ALLOWED_ATTR pollution via setConfig (GHSA-cmwh-pvxp-8882).
  # dompurify <=3.4.12: IN_PLACE hook removal leaves a detached subtree
  # executable -> XSS (GHSA-55q2-fjhq-7xh7). Patched in 3.4.13.
  # Pulled in transitively by monaco-editor (webui).
  wrongstack: link:apps/wrongstack
peerDependencyRules:
  # TypeScript 7 was released before i18next/react-i18next widened their peer
  # ranges. WrongStack's WebUI passes its TS7 typecheck; allow this known lag.
  allowedVersions:
    "i18next>typescript": "7"
    "react-i18next>typescript": "7"
# GHSA-gv7w-rqvm-qjhr: esbuild "missing binary integrity verification" applies
# only to esbuild's DENO installer path; we consume esbuild directly and via
# Vite/Vitest on Node. Remove once the advisory no longer applies to our range.
auditConfig:
  ignoreGhsas:
    - GHSA-gv7w-rqvm-qjhr
allowBuilds:
  '@biomejs/biome': true
  # Electron's install script fetches the platform runtime used by
  # apps/desktop. Keep this explicit so new installs can run the desktop app.
  electron: true
  esbuild: true
  # node-pty is an optional WebUI terminal dependency (used by the
  # integrated shell panel). We allow its prebuild-install script so the
  # package can fetch a Node-ABI-matching native binary from the
  # node-pty GitHub releases on install; this avoids forcing every
  # contributor to install MSVC + Python just to run the WebUI.
  # The script only downloads binaries published by microsoft/node-pty;
  # it does not execute arbitrary remote code.
  node-pty: true
  # onnxruntime-node: REGULAR dependency of @huggingface/transformers
  # (pulled in by @wrongstack/vector-memory; not optional). Its postinstall
  # (`node ./script/install`) downloads only files NOT bundled in the npm
  # package: per script/install-metadata.js the requirements manifest is
  # non-empty ONLY for linux/x64 (CUDA EP binaries), fetched from
  # Microsoft's official NuGet feed (api.nuget.org — packages
  # Microsoft.ML.OnnxRuntime.Gpu.Linux, same publisher as this package).
  # win32 and darwin manifests are empty — no download on Windows/macOS.
  # Reviewed 2026-08-16 against the 1.24.3 install scripts. Without the
  # approval, pnpm 11 fails `install` hard (ERR_PNPM_IGNORED_BUILDS), which
  # broke every CI run since the vector-memory chain landed.
  onnxruntime-node: true
  # protobufjs: regular dependency of onnxruntime-web, which is a regular
  # dependency of @huggingface/transformers (@wrongstack/vector-memory).
  # Its postinstall (`node scripts/postinstall`) is a Node-version
  # detection no-op that logs a deprecation hint on old Node; it downloads
  # and executes nothing. Reviewed 2026-08-16.
  protobufjs: true
  # sharp: optionalDependency of @huggingface/transformers (pulled in by
  # @wrongstack/vector-memory). Sharp's postinstall downloads a prebuilt
  # native libvips binary for the current platform from npm; it does not
  # execute arbitrary remote code beyond the package's own published
  # release artifacts. Reviewed 2026-08-15 — the binary is fetched from
  # sharp's own `@img/sharp-linux-x64` / `@img/sharp-darwin-arm64` etc.
  # subpackages on the public npm registry (no third-party hosts), and
  # the binary URL is pinned by version in sharp's package.json.
  sharp: true
onlyBuiltDependencies:
  - "@biomejs/biome"
  - electron
  - esbuild
  - node-pty
  - onnxruntime-node
  - protobufjs
  - sharp
# Install cooldown: refuse versions published less than 24h ago. This is the
# single most effective defence against a compromised-maintainer / npm account
# takeover, where a malicious version is published and yanked within hours.
# `minimumReleaseAgeExclude` below was already present but had nothing to
# exclude from — the cooldown itself was never defined (WS-039).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - electron@43.0.0
  - "@agentclientprotocol/sdk@1.4.0"
  - "@datadog/pprof@5.18.1"
  - "ai@7.0.73"
  - "@ai-sdk/gateway@4.0.59"
patchedDependencies: { ink@7.1.1: patches/ink@7.1.1.patch }
