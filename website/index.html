<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wrongstack.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta

      content="A free and open-source AI coding agent with isolated project goals, 73 built-in tools, TypeScript dead-code cleanup, durable memory, and explicit execution controls."
    />
    <meta name="theme-color" content="oklch(99% 0 0)" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="oklch(18% 0.01 260)" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="WrongStack — AI coding, under your control" />
    <meta
      property="og:description"
      content="WrongStack 1.0.37: Bun-first development, a Skill Companion that recommends missed skills, sealed subagents, 114 bundled skills, and focused browser and code-reading tools."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wrongstack.com" />
    <meta property="og:image" content="https://wrongstack.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WrongStack — AI coding, under your control" />
    <meta name="twitter:description" content="WrongStack: isolated project goals, 73 tools, 114 bundled skills, Bun-first development, explicit execution controls, and skill guidance built in." />
    <meta name="twitter:image" content="https://wrongstack.com/og.png" />

    <link rel="canonical" href="https://wrongstack.com" />

    <title>WrongStack — AI coding, under your control</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "WrongStack",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "macOS, Linux, Windows",
        "description": "A free and open-source AI coding agent with isolated project goals, TypeScript dead-code cleanup, explicit execution controls, project-learning fleets, 73 built-in tools, 99 managed plugins, 114 bundled skills, and six interfaces.",
        "url": "https://wrongstack.com",
        "softwareVersion": "1.0.37",
        "dateModified": "2026-10-10T00:00:00Z",
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "codeRepository": "https://github.com/WrongStack/WrongStack"
      }
    </script>
    <!-- Apply persisted theme before paint to avoid a flash -->
    <script>
      (() => {
        try {
          var t = localStorage.getItem("theme");
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = t === "dark" || ((t === null || t === "system") && sysDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
