    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "WrongStack",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "macOS, Linux, Windows",
        "description": "A free and open-source AI coding agent with isolated project goals, TypeScript dead-code cleanup, explicit execution controls, project-learning fleets, 82 built-in tools, 99 managed plugins, 116 bundled skills, and five interfaces.",
        "url": "https://wrongstack.com",

        "dateModified": "2026-11-12T00:00:00Z",
        "license": "https://opensource.org/licenses/MIT",

        "codeRepository": "https://github.com/WrongStack/WrongStack"
      }

    <!-- Apply persisted theme before paint to avoid a flash -->
    <script>
      (() => {
        try {
          var t = localStorage.getItem("theme");
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = t === "dark" || ((t === null || t === "system") && sysDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
