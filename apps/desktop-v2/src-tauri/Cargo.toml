[package]
name = "wrongstack-desktop-v2"
version = "1.6.1"
edition = "2021"
default-run = "wrongstack-desktop-native"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:rfd", "dep:tauri-build", "dep:windows"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true , features = [] }

[dependencies]
tauri = { version = "=2.12.5", optional = true, features = ["devtools"] }
rfd = { version = "=0.17.2", optional = true }
portable-pty = "=0.9.0"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
uuid = { version = "=1.29.0", features = ["v4"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }

# Dictation (`speech.rs`) and opening links (`desktop.rs`, ShellExecute). The same windows crate
# WebView2 already pulls in, with the speech and shell APIs.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = ["Foundation", "Globalization", "Media_SpeechRecognition", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "wrongstack-desktop-native"
path = "src/main.rs"
