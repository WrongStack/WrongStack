<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wrongstack.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- WrongStack corporate palette — logo black #121210 (meta theme-color cannot use CSS vars) -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121210" />
    <!-- WrongStack corporate palette — brand ivory #F8F6F0 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f6f0" />
    <!-- Fonts are self-hosted via @fontsource imports in src/main.tsx. Do NOT add
         Google Fonts links here: the SimpleUI CSP (style-src 'self') blocks them
         and SimpleUI must stay offline-first. -->
    <title>WrongStack SimpleUI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
