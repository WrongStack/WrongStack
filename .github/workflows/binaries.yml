name: Binaries

# Builds the standalone executables (scripts/build-binaries.mjs) and smoke-tests
# them on Linux, Windows and macOS. Publishes nothing: the output is a workflow
# artifact. release.yml calls this for a tag and uploads the artifact to the
# GitHub release; run it by hand (Actions → Binaries → Run workflow, or
# `gh workflow run binaries.yml`) to prove a tree still produces working
# binaries without cutting a release.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (release.yml passes the SHA its verify job validated)
        required: true
        type: string
      artifact-name:
        description: Name of the uploaded artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  binaries:
    name: Build standalone binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Build provenance: `id-token` mints the OIDC token that binds the
      # attestation to THIS workflow, commit and runner; `attestations` stores
      # it. The npm half of the release already publishes with OIDC
      # provenance — the standalone executables, which are now the primary
      # distribution, had only a SHA256SUMS file fetched from the same release
      # as the binary. That detects corruption, not a forged release.
      id-token: write
      attestations: write
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          # The caller passes the SHA its `verify` job validated (release.yml).
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install dependencies
        # Same VF-31 hardening as `pack`: these executables ship to users, so
        # dependency lifecycle code must not run here either.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        run: bun run setup:native

      # Builds the workspace, then cross-compiles every target from this one
      # runner (bun downloads each target's runtime) — see
      # scripts/build-binaries.mjs.
      - name: Build binaries
        run: bun scripts/build-binaries.mjs

      - name: Smoke-test the Linux binary
        run: bun scripts/smoke-binary.mjs dist-bin/wstack-linux-x64

      # The installers ship in the same release as the binaries, so they belong
      # in the same manifest. They cannot verify themselves — a `curl | sh`
      # bootstrap trusts HTTPS to github.com and nothing else — but publishing
      # their digests lets anyone who already has the manifest (or a pinned
      # copy of it) check what they piped into a shell, and lets the release
      # gate refuse an asset that nothing vouched for.
      - name: Stage installers
        run: |
          set -euo pipefail
          cp scripts/install/install.sh scripts/install/install.ps1 dist-bin/
          (cd dist-bin && sha256sum install.sh install.ps1 >> SHA256SUMS)
          (cd dist-bin && sha256sum --check SHA256SUMS)

      # Attest what was just built, before anything leaves this job. Verify a
      # downloaded binary with:
      #   gh attestation verify wstack-linux-x64 --repo WrongStack/WrongStack
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (pinned 2026-09-22)
        with:
          subject-path: |
            dist-bin/wstack-*
            dist-bin/SHA256SUMS

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24 runtime, pinned 2026-09-06)
        with:
          name: ${{ inputs.artifact-name || format('binaries-{0}', github.run_id) }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 7

  binaries-smoke:
    name: Smoke binary on ${{ matrix.os }}
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: dist-bin/wstack-windows-x64.exe
          - os: windows-11-arm
            binary: dist-bin/wstack-windows-arm64.exe
          - os: macos-latest
            binary: dist-bin/wstack-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24 runtime, pinned 2026-09-06)
        with:
          name: ${{ inputs.artifact-name || format('binaries-{0}', github.run_id) }}
          path: dist-bin

      - name: Prepare binary
        if: runner.os != 'Windows'
        env:
          BINARY: ${{ matrix.binary }}
        # Artifacts drop the executable bit; macOS also needs the ad-hoc
        # signature install.sh applies.
        run: |
          chmod +x "$BINARY"
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - "$BINARY"; fi

      # Runs only the smoke script — no dependency install, it uses node: builtins.
      - name: Smoke
        env:
          BINARY: ${{ matrix.binary }}
        shell: bash
        run: bun scripts/smoke-binary.mjs "$BINARY"
