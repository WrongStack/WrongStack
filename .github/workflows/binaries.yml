name: Binaries

# Builds the standalone executables (scripts/build-binaries.mjs) and smoke-tests
# them on Linux, Windows and macOS. Publishes nothing: the output is a workflow
# artifact. release.yml calls this for a tag and uploads the artifact to the
# GitHub release; run it by hand (Actions → Binaries → Run workflow, or
# `gh workflow run binaries.yml`) to prove a tree still produces working
# binaries without cutting a release.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (release.yml passes the SHA its verify job validated)
        required: true
        type: string
      artifact-name:
        description: Name of the uploaded artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  binaries:
    name: Build standalone binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          # The caller passes the SHA its `verify` job validated (release.yml).
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (pinned 2026-09-18)
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # Same VF-31 hardening as `pack`: these executables ship to users, so
        # dependency lifecycle code must not run here either.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild electron-winstaller esbuild node-pty

      # Builds the workspace, then cross-compiles every target from this one
      # runner (bun downloads each target's runtime) — see
      # scripts/build-binaries.mjs.
      - name: Build binaries
        run: node scripts/build-binaries.mjs

      - name: Smoke-test the Linux binary
        run: node scripts/smoke-binary.mjs dist-bin/wstack-linux-x64

      - name: Stage installers
        run: cp scripts/install/install.sh scripts/install/install.ps1 dist-bin/

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24 runtime, pinned 2026-09-06)
        with:
          name: ${{ inputs.artifact-name || format('binaries-{0}', github.run_id) }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 7

  binaries-smoke:
    name: Smoke binary on ${{ matrix.os }}
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: dist-bin/wstack-windows-x64.exe
          - os: macos-latest
            binary: dist-bin/wstack-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          node-version: 22
          # No pnpm on this job; v5 would otherwise auto-enable the pnpm cache
          # from package.json's `packageManager` and fail looking for pnpm.
          package-manager-cache: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24 runtime, pinned 2026-09-06)
        with:
          name: ${{ inputs.artifact-name || format('binaries-{0}', github.run_id) }}
          path: dist-bin

      - name: Prepare binary
        if: runner.os != 'Windows'
        env:
          BINARY: ${{ matrix.binary }}
        # Artifacts drop the executable bit; macOS also needs the ad-hoc
        # signature install.sh applies.
        run: |
          chmod +x "$BINARY"
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - "$BINARY"; fi

      # Runs only the smoke script — no dependency install, it uses node: builtins.
      - name: Smoke
        env:
          BINARY: ${{ matrix.binary }}
        shell: bash
        run: node scripts/smoke-binary.mjs "$BINARY"
