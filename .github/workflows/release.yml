name: Release

# WS-040 — publish from CI on a tag, using npm trusted publishing (OIDC),
# instead of `pnpm release` from a maintainer's laptop with a long-lived
# automation token.
#
# What this changes about the threat model
# ────────────────────────────────────────
# The previous path was: a maintainer runs `pnpm publish -r --no-git-checks`
# locally with an npm token in their environment. That token is long-lived,
# publishes any package in the org, and lives on a developer machine alongside
# every dependency's postinstall script. `--no-git-checks` additionally removed
# pnpm's own refusal to publish from a dirty tree or the wrong branch, so the
# published artifact did not have to correspond to any commit.
#
# Here, the credential is a short-lived OIDC token minted per run, scoped to
# this repository and this workflow file, and unusable anywhere else. npm binds
# the published artifact to the workflow + commit that produced it via a
# provenance attestation, so a consumer can verify where a tarball came from.
#
# REQUIRED ONE-TIME SETUP — this workflow FAILS until both are done
# ─────────────────────────────────────────────────────────────────
#  1. npmjs.com → each published package → Settings → Trusted Publisher:
#     organization `<owner>`, repository `<repo>`, workflow `release.yml`,
#     environment `npm-publish`. This must be repeated for EVERY public
#     workspace package — npm binds trust per package, not per org. Run
#     `node scripts/list-publishable-packages.mjs` for the current list.
#  2. GitHub → Settings → Environments → create `npm-publish` with required
#     reviewers. The environment is what makes a tag push a *request* to
#     publish rather than a publish: pushing a tag cannot ship on its own.
#
# Until (1) is done for a given package, its publish step fails with
#
#   npm error need auth This command requires you to be logged in to
#   https://registry.npmjs.org/
#
# and NOT the 404 this comment used to predict (observed on v1.0.23, npm
# 11.19.1): with no trusted publisher registered, npm never attempts the OIDC
# exchange at all and falls back to token auth, where there is no token. That
# message is npm reporting a missing credential, not a bug here — nothing in
# this workflow supplies one by design.
#
# pnpm version floor
# ──────────────────
# OIDC publishing is broken in pnpm 11.0.8 (pnpm#11513, fixed by pnpm#11526)
# and works from 11.1.3. `packageManager` in the root manifest pins the version
# actually used; the guard below fails loudly rather than falling back to token
# auth if that pin is ever moved below the floor.

on:
  push:
    tags: ['v*.*.*']
  # Manual re-run for a tag whose publish failed partway (npm publishes are
  # per-package, so a mid-run failure can leave some packages published).
  # Re-running is safe: npm rejects a re-publish of an existing version, so
  # already-published packages are skipped rather than overwritten.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.298.0)'
        required: true
        type: string

# Read-only by default. The publish job opts into `id-token: write` for OIDC;
# nothing here needs write access to repository contents.
permissions:
  contents: read

# Never cancel a run that may be mid-publish — a cancelled publish leaves the
# workspace half-shipped. Queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.tag.outputs.version }}
      # The commit this job actually validated. `publish` checks THIS out rather
      # than re-resolving the tag, so a movable tag cannot be repointed at a
      # different tree between the ancestor check here and the reviewer approval
      # on the npm-publish environment (WS-089).
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Need history to prove the tag is an ancestor of main.
          fetch-depth: 0
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - name: Resolve and check the tag
        id: tag
        # Bound through the environment, never interpolated into the script
        # text. `${{ }}` is substituted BEFORE the shell parses anything, so
        # `raw="${{ github.ref_name }}"` executed whatever the tag name
        # contained. git ref-format permits `` ` ``, `$`, `(`, `)`, `;`, `"`,
        # `#`, `|` and `&`, and `v1.0.0";…;#` still matches the `v*.*.*`
        # trigger glob — so this ran before both safety checks below, with the
        # cross-job pnpm cache as a path into the `id-token: write` job (WS-089).
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          raw="$RAW_TAG"
          version="${raw#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          manifest="$(node -p "require('./package.json').version")"
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $raw does not match root package.json version $manifest."
            exit 1
          fi

          # The tag must point at a commit on main. Without this, anyone able
          # to push a tag could publish an arbitrary tree — the tag name is
          # otherwise the only thing tying a release to reviewed code.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::Tag $raw is not an ancestor of origin/main; refusing to publish."
            exit 1
          fi

          # Pin the exact commit that passed the checks above so `publish`
          # cannot resolve the tag to something else later.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the pnpm pin clears the OIDC floor
        run: |
          set -euo pipefail
          pinned="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          floor="11.1.3"
          # Sort the two versions; if the smaller one is not the floor, the pin
          # predates the OIDC fix and publishing would silently fall back to
          # token auth (or fail with a confusing 404).
          if [ "$(printf '%s\n%s\n' "$pinned" "$floor" | sort -V | head -n1)" != "$floor" ] \
             && [ "$pinned" != "$floor" ]; then
            echo "::error::pnpm $pinned is below the $floor OIDC floor (pnpm#11513)."
            exit 1
          fi
          echo "pnpm $pinned clears the $floor OIDC floor."

  # The full release gate (release:check). Only the npm path waits on it: the
  # standalone binaries are validated by their own cross-platform smoke in
  # binaries.yml, so an unrelated red suite does not hold back a GitHub release.
  gate:
    name: Release gate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          # The SHA `verify` validated — same anti-movable-tag rule as publish.
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # I1 (SC-SUPPLY-001): nine of ten `pnpm install` invocations across
        # all workflows pass `--ignore-scripts`; this one (the only
        # release-pipeline install) did not, and `needs: verify` upstream
        # of `pack` means a compromised transitive postinstall could
        # tamper with the pnpm store cache that `pack` restores and ships
        # under the repo's provenance attestation. Mirror the rest of
        # the repo and refuse to run lifecycle scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Release gate
        run: pnpm release:check

  pack:
    name: Pack npm tarballs
    needs: [verify, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          # The SHA `verify` validated — same anti-movable-tag rule as publish.
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Same VF-31 hardening as CI: this job's OUTPUT is what gets
        # published, so dependency lifecycle code must not run here either —
        # a tampered tarball poisons the release exactly like a tampered
        # publish would. Native build deps come from the explicit rebuild.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Kept in sync with pnpm-workspace.yaml allowBuilds — pinned by
        # packages/core/tests/architecture/build-allowlist-freshness.test.ts.
        run: pnpm rebuild electron-winstaller esbuild node-pty

      - name: Build
        run: pnpm build

      # M13 / VF-19 (security report Phase 4): all build-time and pack-time
      # dependency code — postinstall, prepare, prepack — executes HERE, in a
      # job whose only credential is the read-only checkout. The privileged
      # `publish` job below consumes this job's OUTPUT as tarballs and runs no
      # dependency code at all.
      - name: Pack publishable tarballs
        run: node scripts/publish-workspace.mjs --pack --pack-destination artifacts/npm-packs

      - name: Upload packed tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24 runtime, pinned 2026-09-06)
        with:
          name: npm-tarballs-${{ needs.verify.outputs.version }}
          path: artifacts/npm-packs/
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: Standalone binaries
    needs: verify
    # Build + cross-platform smoke live in binaries.yml so the exact same jobs
    # can be run by hand without cutting a release.
    uses: ./.github/workflows/binaries.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}
      artifact-name: binaries-${{ needs.verify.outputs.version }}
    permissions:
      contents: read

  desktop:
    name: Desktop packages
    needs: verify
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}
      artifact-name: desktop-${{ needs.verify.outputs.version }}
    permissions:
      contents: read

  publish-desktop:
    name: Attach Desktop to GitHub release
    # Desktop cannot block the CLI release, and npm cannot block Desktop.
    needs: [verify, desktop, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-${{ needs.verify.outputs.version }}-*
          merge-multiple: true
          path: desktop-assets
      - name: Upload Desktop packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd desktop-assets
          cat DESKTOP-SHA256SUMS-* | sort -k2,2 > DESKTOP-SHA256SUMS
          sha256sum --check DESKTOP-SHA256SUMS
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            wrongstack-desktop-* DESKTOP-SHA256SUMS

  publish:
    name: Publish to npm
    needs: [verify, pack]
    runs-on: ubuntu-latest
    # Raised from 30: the publish step now waits on registry propagation
    # between dependency layers (11 layers x 120s worst case) on top of
    # install and build.
    timeout-minutes: 60
    # Required reviewers on this environment are what stop a tag push from
    # shipping on its own. Do not remove without replacing the control.
    environment: npm-publish
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights.
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          # The SHA `verify` validated, not the tag. Re-resolving the ref here
          # meant a tag could be moved after the ancestor check and after the
          # environment reviewer approved, and this job would build and publish
          # the new tree (WS-089).
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # M13 / VF-19: deliberately NO pnpm here and NO install step. This job
      # holds the id-token; `pnpm install` + `pnpm build` inside it meant every
      # dependency's lifecycle scripts executed one environment-variable read
      # away from the publish credential. Tarballs arrive pre-packed from the
      # unprivileged `pack` job; only this repository's own dependency-free
      # script and the Node-bundled npm run below.
      #
      # Deliberately NO `registry-url` here. setup-node's registry-url writes
      # an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` unconditionally;
      # with no token in the environment, npm sends the literal unexpanded
      # placeholder as a bearer token and the OIDC exchange never happens. The
      # default registry is correct and needs no .npmrc. No pnpm also means no
      # pnpm store to cache: v5 turns the pnpm cache on from package.json's
      # packageManager field and fails with 'Unable to locate executable
      # file: pnpm', so it has to be switched off explicitly.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download packed tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24 runtime, pinned 2026-09-06)
        with:
          name: npm-tarballs-${{ needs.verify.outputs.version }}
          path: release-tarballs

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        # Node 22 bundles npm 10.x, whose publish path cannot exchange the
        # OIDC token for publish rights — npm trusted publishing needs
        # npm >= 11.5.1 (Chimera review). setup-node does not upgrade npm,
        # so install an explicit npm 11 and assert the floor here, failing
        # loudly instead of with a confusing 403/404 at publish time.
        run: |
          npm install -g npm@11
          node -e "const v=require('node:child_process').execSync('npm --version').toString().trim().split('.').map(Number);const [major,minor,patch]=v;const ok=major>11||(major===11&&(minor>5||(minor===5&&patch>=1)));if(!ok){console.error('npm '+v.join('.')+' is below the 11.5.1 OIDC trusted-publishing floor');process.exit(1)}console.log('npm '+v.join('.')+' clears the OIDC floor')"

      - name: Publish
        # Tarball mode (M13/VF-19): publishes exactly what the unprivileged
        # `pack` job produced — see the download step above for why no
        # dependency code runs in this job.
        #
        # `release:ci` keeps `--no-git-checks`, and that is not the defect the
        # finding was about. A tag checkout is a DETACHED HEAD, so pnpm's
        # "are you on the publish branch" check cannot pass here by
        # construction — leaving it on would fail every release rather than
        # protect one. What it guarded against is replaced, more strictly, by
        # the verify job: the tag must match the root manifest version, and it
        # must be an ancestor of origin/main. Tree cleanliness is guaranteed by
        # a fresh CI checkout rather than asserted.
        #
        # The flag has been removed from the LOCAL `release` script, which is
        # where it was actually dangerous: there it let a maintainer publish a
        # dirty tree from any branch, so the tarball need not match any commit.
        #
        # `release:ci` no longer calls `pnpm publish -r` directly. That
        # published concurrently, so the registry could observe a package
        # before its own dependencies — in 0.317.2 `wrongstack` landed 25s
        # ahead of `@wrongstack/webui-hq` and every install in that window
        # died with ETARGET. It now runs `scripts/publish-workspace.mjs`,
        # which publishes in dependency layers and polls the registry until
        # each layer is resolvable before starting the next (`--gate-layers`;
        # local releases skip that wait). Verification is network-bound, so
        # --verify-timeout caps each layer at 120s and the job timeout above
        # accounts for the worst-case sum.
        run: node scripts/publish-workspace.mjs --tarballs-dir release-tarballs --gate-layers --verify-timeout 120

      - name: Summary
        if: always()
        # Same rule as the tag step: job outputs are tag-derived, so they go
        # through the environment rather than into the script text.
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Release $RELEASE_VERSION"
            echo ""
            echo "Published via npm trusted publishing (OIDC) from \`release.yml\`."
            echo "Provenance attestations are attached automatically — no \`--provenance\` flag is needed."
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create GitHub release
    # Depends on the binaries, NOT on npm: the standalone executables are the
    # primary distribution, and an npm registry failure must not hold back a
    # release (the npm jobs above still run and report on their own).
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24 runtime, pinned 2026-09-06)
        with:
          name: binaries-${{ needs.verify.outputs.version }}
          path: dist-bin

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          find dist-bin -maxdepth 1 -type f -name 'wstack-*' -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/release-binary-assets"
          awk 'NF == 2 { name=$2; sub(/^\*/, "", name); print name }' dist-bin/SHA256SUMS | LC_ALL=C sort > "$RUNNER_TEMP/checksummed-binary-assets"
          diff -u "$RUNNER_TEMP/release-binary-assets" "$RUNNER_TEMP/checksummed-binary-assets"
          # SHA256SUMS lists bare filenames (`wstack-linux-x64`), not paths, so
          # --check resolves them against the working directory. Run it from
          # dist-bin; from the workspace root every entry fails to open.
          (cd dist-bin && sha256sum --check SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          # --clobber: a manual re-run replaces assets instead of failing.
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist-bin/wstack-* dist-bin/SHA256SUMS dist-bin/install.sh dist-bin/install.ps1
