name: Deploy Website

# Builds the marketing/docs site in website/ and publishes it to GitHub Pages
# at the apex domain wrongstack.com (CNAME lives in website/public/CNAME, which
# Vite copies into the build output). Pages "Source" must be set to
# "GitHub Actions" in the repository settings for this to deploy.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # The website build validates these source-owned catalogs. Trigger the
      # deploy workflow when they change so stale operator pages fail visibly.
      - 'packages/tools/src/builtin.ts'
      - 'packages/tools/src/browser/tools.ts'
      - 'packages/cli/src/plugin-management.ts'
      - 'packages/core/src/types/mode.ts'
      - 'packages/core/src/coordination/fleet.ts'
      - 'packages/core/src/coordination/agents/phase*.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# WS-014: `pages: write` and `id-token: write` are declared per-job, not here.
# At workflow level the build job inherits them while running `npm ci` and
# `vite build` over the website's own dependency tree — arbitrary third-party
# code. A compromised dependency there could mint an OIDC token or deploy to
# wrongstack.com, bypassing the `github-pages` environment gate entirely. The
# build job only needs to read the repo.
permissions:
  contents: read

# Only one Pages deploy at a time. Don't cancel an in-flight deploy — a half-
# applied deployment is worse than waiting for the previous one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Third-party actions pinned to full commit SHAs (see ci.yml for rationale).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (resolved 2026-05-29)
        with:
          persist-credentials: false

      # The website is a standalone npm project (its own package-lock.json), not
      # part of the pnpm workspace — so it builds with npm, cached on its lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-05-29)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (resolved 2026-05-29)

      # `--ignore-scripts`: the website tree is outside the pnpm workspace, so
      # root `onlyBuiltDependencies` does not gate its install scripts, and
      # `pnpm audit` in ci.yml does not cover these packages either (WS-014).
      - name: Install dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Audit website dependencies
        working-directory: website
        run: npm audit --audit-level=moderate

      - name: Build
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (resolved 2026-05-29)
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (resolved 2026-05-29)
