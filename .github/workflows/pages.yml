name: Deploy Website

# Builds the marketing/docs site in website/ and publishes it to GitHub Pages
# at the apex domain wrongstack.com (CNAME lives in website/public/CNAME, which
# Vite copies into the build output). Pages "Source" must be set to
# "GitHub Actions" in the repository settings for this to deploy.

on:
  # Manual only: pushes / PRs / schedules never start this workflow.
  workflow_dispatch:

# WS-014: `pages: write` and `id-token: write` are declared per-job, not here.
# At workflow level the build job inherits them while running `npm ci` and
# `vite build` over the website's own dependency tree — arbitrary third-party
# code. A compromised dependency there could mint an OIDC token or deploy to
# wrongstack.com, bypassing the `github-pages` environment gate entirely. The
# build job only needs to read the repo.
permissions:
  contents: read

# Only one Pages deploy at a time. Don't cancel an in-flight deploy — a half-
# applied deployment is worse than waiting for the previous one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Verify website code before the separate build and privileged deploy jobs.
  website-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          persist-credentials: false

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Match CI's reviewed native set; do not execute arbitrary install scripts.
      - name: Rebuild reviewed native dependencies
        run: bun run setup:native

      - name: TypeCheck (website tests)
        run: bun run --filter wrongstack-website typecheck:tests

      - name: Test (website)
        run: bun run --filter wrongstack-website test

  build:
    needs: website-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Third-party actions pinned to full commit SHAs (see ci.yml for rationale).
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24 runtime, pinned 2026-09-06)
        with:
          persist-credentials: false

      # The website uses the same frozen Bun workspace lockfile as verification.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (Node 24 runtime, pinned 2026-09-06)

      # Keep dependency lifecycle scripts disabled in this read-only build job.
      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit website dependencies
        working-directory: website
        run: bun ../scripts/audit-dependencies.mjs --audit-level=moderate

      - name: Build
        working-directory: website
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (resolved 2026-05-29)
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node 24 runtime, pinned 2026-09-06)
