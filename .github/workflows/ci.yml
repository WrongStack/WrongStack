name: CI

# Monorepo gate: lint → typecheck → build → test.
# Runs on every push and PR to main; also dispatchable manually.
# Permissions are kept minimal — read-only repo access is sufficient
# because this workflow does not publish or deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one CI run per ref at a time. Cancel the older one so a rapid
# push sequence doesn't queue a backlog of stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      # pnpm/action-setup — resolves the correct pnpm version from
      # packageManager in root package.json. Pinned to a commit SHA like every
      # other third-party action: a mutable tag lets the upstream owner change
      # what runs in CI after review (WS-041).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      # Dependency specs must not contain Windows path separators. A
      # backslashed `link:`/`file:` path installs fine on NTFS and then
      # breaks every POSIX `pnpm install --frozen-lockfile` (specifier
      # mismatch vs the forward-slashed lockfile). Pure Node, no deps —
      # deliberately BEFORE install so the signal arrives without paying
      # the install cost first.
      - name: Lint (dep path separators)
        run: node scripts/check-dep-path-separators.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      - name: Lint
        run: pnpm biome lint .

      # F-03: fail when a file imports '../<self-area>/...' — the
      # signature of a leftover relative path after a file was moved
      # into a subdirectory. Catches move-leftover bugs that the type
      # checker (type-only erased) would otherwise miss. Cheap (~50ms);
      # no third-party action required.
      - name: Lint (relative imports)
        run: pnpm lint:imports

      # docs/feature-matrix.md is the only place mapping a plugin to the tool
      # ids an operator types, and it is hand-written. It had drifted into 19
      # wrong tool names and a missing plugin before this gate existed.
      - name: Check (plugin feature matrix)
        run: pnpm check:feature-matrix

      # Biome warnings exit 0, so the Lint step above cannot see them.
      # check:lint-warnings ratchets production-scope warnings against
      # architecture/lint-warning-baseline.json: a new or increased count
      # fails, and a fixed count must lower the baseline in the same change
      # (ratchet-down invariant, mirroring check:test-types).
      - name: Check (lint warning ratchet)
        run: pnpm check:lint-warnings

  typecheck:
    name: TypeCheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      # Build first so cross-package type declarations exist. Several packages
      # (e.g. @wrongstack/kanban) import workspace deps like
      # @wrongstack/persistence whose `types` resolve to dist/*.d.ts, which do
      # not exist until the producing package is built. Without this, tsc in a
      # clean CI checkout fails with TS2307 "Cannot find module".
      - name: Build workspace declarations
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Workspace typecheck, serially to avoid tsc buildinfo contention.
      # Matches the root package.json script exactly.
      # Each package's `typecheck` script covers BOTH its source tsconfig and
      # its test tsconfig (e.g. packages/tui runs `tsc --noEmit &&
      # tsc --noEmit -p tsconfig.test.json`), so test-fixture/type-contract
      # drift fails this gate instead of silently accumulating.
      - name: TypeCheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test-inclusive TypeScript ratchet
        run: pnpm check:test-types

  build:
    name: Build (esbuild + tsc declarations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      - name: Assert clean artifact lineage
        run: pnpm check:clean-dist

      # Topological build via the centralized driver.
      # ESBuild for JS bundles, native tsc --emitDeclarationOnly for types.
      - name: Build
        run: pnpm build

      # Security report Phase 4 item 20 / VF-30: pin the vendored tree-sitter
      # grammar set to wasm/checksums.json — a tampered or accidentally
      # swapped .wasm fails the build here instead of executing silently at
      # index time (the runtime check in tree-sitter-parser.ts is the
      # second layer).
      - name: Verify vendored tree-sitter grammars
        run: node scripts/check-tree-sitter-wasm.mjs

      - name: Verify package contracts
        run: node scripts/check-package-contracts.mjs

      - name: Write artifact lineage manifest
        run: pnpm write:build-manifest

      # WS-070: the upload below sets `include-hidden-files: true` so the
      # lineage manifest under `.reports/` is included — but that flag applies
      # to every path in the upload, so a dotfile inside any `dist` would be
      # published to an artifact readable by anyone with repo read access.
      # Asserting none exist keeps the flag honest without adding `!` exclusion
      # patterns, which would change how upload-artifact computes the artifact
      # root and silently break the two jobs that download it into `.`.
      - name: Assert no hidden files in build output
        run: pnpm check:dist-hidden

      - name: Upload verified build lineage
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: |
            .reports/build-artifact-manifest.json
            packages/*/dist
            apps/*/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # -----------------------------------------------------------------
  # Manifest & projection drift gate. These four checks exist in
  # `pnpm release:check` but were release-only: a PR could merge
  # CI-green and surface provider-catalog / plugin-projection / i18n /
  # rulebook drift weeks later at release time. All four are fast
  # snapshot-or-schema comparisons, so they run here at PR time.
  # -----------------------------------------------------------------
  manifests:
    name: Manifest drift (catalog, projections, i18n, rulebook)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      - name: Download verified build lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: .

      - name: Verify artifact lineage
        run: pnpm check:build-manifest

      # The catalog/projection scripts rebuild the package they project
      # from (`pnpm --filter ... build` is part of the pnpm script), so
      # no separate build step is needed — the downloaded lineage only
      # has to satisfy cross-package type resolution for that rebuild.
      - name: Provider catalog snapshot check
        run: pnpm providers:catalog:check

      - name: Plugin projection snapshot check
        run: pnpm plugins:manifest:check

      - name: i18n completeness check
        run: pnpm lint:i18n

      # The rulebook is optional and untracked by default; when absent
      # this validates the checker itself runs, and it hard-fails
      # (exit 5) for any PR that adds an invalid one.
      - name: TechStack rulebook schema check
        run: pnpm check:rulebook

  test:
    name: Test (Vitest + coverage ratchets)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: this job runs `pnpm check:architecture`, whose
          # evidence-freshness gate compares commit timestamps between watched
          # roots (architecture/, packages/, apps/) and the committed report
          # pair. In the default depth-1 checkout the gate cannot decide
          # freshness (path-filtered history at the shallow boundary treats
          # every path as newly added at HEAD) and skips with a warning.
          fetch-depth: 0
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      # Download verified build artifacts so workspace dist/ folders exist
      # before the coverage run. Without this, 257+ test files that import
      # @wrongstack/webui-server, @wrongstack/mcp, etc. fail with
      # "Failed to resolve entry for package" because those packages'
      # dist/ directories don't exist in a clean checkout.
      - name: Download verified build lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: .

      - name: Verify artifact lineage
        run: pnpm check:build-manifest

      - name: Architecture and runtime-test inventory
        run: pnpm check:architecture && pnpm check:test-inventory && pnpm check:test-skips

      # Runs aggregate Node/WebUI ratchets plus focused per-file gates.
      - name: Test with coverage ratchets
        run: pnpm test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # hq-dashboard needs jsdom which the root forks pool can't resolve.
      # Run it from its package context so its own vitest config applies.
      - name: Test (hq-dashboard)
        run: pnpm --filter @wrongstack/cli test:hqdash
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The dedicated config supplies FORCE_COLOR=3 and COLORTERM=truecolor
      # so status-bar-overflow can assert Chalk's truecolor output.
      - name: Test (TUI status-bar overflow)
        run: pnpm --filter @wrongstack/tui test:status-bar
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Focused plugin-guard matrix (issues #360 / #363): Windows .cmd shims
  # and kill-defense parsers only fire on their native OS. Keep this job
  # narrow so the full coverage suite stays on ubuntu-latest.
  plugin-guards:
    name: Plugin guards (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      - name: Download verified build lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: .

      - name: Plugin guard regression
        run: pnpm --filter @wrongstack/plugins exec vitest run tests/process-guard.test.ts tests/lint-gate.test.ts tests/lint-gate-platform.test.ts tests/path-guard.test.ts tests/secret-scanner.test.ts tests/prompt-firewall.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # -----------------------------------------------------------------
  # E2E tests (Playwright)
  # Runs after the build so the global-setup can launch the WebUI
  # server against the compiled output. Serial execution because
  # the WebUI server binds to a single port.
  # -----------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    # 25 (was 15): the browser-install step can stall against the apt
    # mirror (observed 2026-08-19: 3 of 4 runs hung ~13 min in apt-get
    # fetch with zero progress until the 15m job timeout killed them,
    # reported misleadingly as "cancelled"). The extra headroom plus the
    # per-attempt cap on the install step makes one transient stall
    # survivable instead of fatal to the whole job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      - name: Download verified build lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: .

      - name: Verify artifact lineage
        run: pnpm check:build-manifest

      # Warm up workspace dist artifacts before Playwright runs. The
      # E2E job is dispatched on its own runner in parallel with the
      # Build job, so the downloaded artifact may not include every
      # dist entry Playwright's tsconfig-resolve path needs (it walks
      # `references: ["./packages/core"]` etc. at module resolution time).
      # Building locally guarantees the missing dist files exist before
      # the Playwright loader walks the references chain.
      - name: Build workspace dist for Playwright tsconfig resolution
        run: pnpm -r build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Playwright browsers are cached to avoid re-downloading on every run.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: |
          # Retry with a per-attempt cap. The observed failure mode is a
          # hang: apt-get stalls against the mirror and never returns
          # non-zero on its own, so a plain re-run would never fire — the
          # job timeout killed it (reported misleadingly as "cancelled").
          # `timeout 7m` turns a stall into exit 124, giving three
          # attempts inside the 25-minute job budget. Shell loop instead
          # of a retry action keeps the pinned-actions policy (WS-041).
          for attempt in 1 2 3; do
            echo "::group::Browser install attempt $attempt/3"
            if timeout 7m pnpm exec playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            code=$?
            echo "::endgroup::"
            echo "Attempt $attempt/3 failed (exit $code)." >&2
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 20s…" >&2
              sleep 20
            fi
          done
          echo "All 3 browser-install attempts failed." >&2
          exit 1

      - name: Run E2E tests
        run: pnpm test:e2e
        # Scoped to this step only — the other E2E steps (cache, browser
        # install) must not see provider env vars. Do NOT hoist to job level.
        env:
          # CI has no saved provider config. These are surfaced by
          # e2e/global-setup.ts as --provider/--model so the WebUI boots
          # into the ready (chat) state instead of the setup screen or the
          # "No provider or model configured" boot gate. openai/gpt-4o-mini
          # is used rather than a fake id because webui-server's provider
          # creation requires a known family (anthropic|openai|...).
          E2E_PROVIDER: openai
          E2E_MODEL: gpt-4o-mini
          # Provider construction needs the key env-var present at startup;
          # the E2E suite is static-only (input fill, send button visibility,
          # slash menu — no chat-completion path), so a placeholder key is
          # enough to satisfy construction. If a future test ever sends a
          # real chat message, route through `${{ secrets.OPENAI_API_KEY }}`
          # or wire a mock LLM endpoint instead. The model id is a real
          # models.dev catalog entry; keep it in sync if OpenAI renames it.
          OPENAI_API_KEY: placeholder-e2e-static-only

      - name: Upload Playwright report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # -----------------------------------------------------------------
  # TUI smoke test — verifies --tui exits cleanly with code 2 and no
  # ANSI sequences when stdin is not a TTY (e.g. piped invocation).
  # Catches: raw-mode hangs, escape-sequence leaks to redirected stdout,
  # and SGR persistence after abnormal exit.
  # -----------------------------------------------------------------
  tui-smoke:
    name: TUI Smoke (non-TTY)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      - name: Download verified build lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: .

      - name: Verify artifact lineage
        run: pnpm check:build-manifest

      - name: Run TUI smoke test
        run: |
          # Redirect stdin from /dev/null so process.stdin.isTTY is false.
          # Redirect stdout to a temp file so we can scan it for ANSI escapes.
          # Exit code 2 is the documented non-TTY guard in run-tui.ts.
          STDOUT_FILE=$(mktemp)
          STDERR_FILE=$(mktemp)

          # Run with a bogus project dir so the TUI bails at the TTY check,
          # not at some other path (missing config, missing API key, etc.).
          EXIT_CODE=0
          node packages/cli/dist/index.js --tui --project . 2>"$STDERR_FILE" >"$STDOUT_FILE" || EXIT_CODE=$?

          echo "Exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "FAIL: TUI hung in non-TTY mode (timeout after 5s)"
            cat "$STDERR_FILE"
            rm -f "$STDOUT_FILE" "$STDERR_FILE"
            exit 1
          fi

          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "FAIL: Expected exit code 2, got $EXIT_CODE"
            echo "--- stderr ---"
            cat "$STDERR_FILE"
            echo "--- stdout ---"
            head -c 500 "$STDOUT_FILE"
            rm -f "$STDOUT_FILE" "$STDERR_FILE"
            exit 1
          fi

          # Verify stderr contains the user-facing non-TTY message.
          if ! grep -q "interactive terminal" "$STDERR_FILE"; then
            echo "FAIL: stderr does not contain expected non-TTY guidance message"
            cat "$STDERR_FILE"
            rm -f "$STDOUT_FILE" "$STDERR_FILE"
            exit 1
          fi

          # Verify stdout is clean — no ANSI escape sequences leaked to redirected output.
          # Pattern: ESC [ followed by any non-newline printable characters.
          if grep -Pq '\x1b\[[0-9;?]*[ -/]*[@-~]' "$STDOUT_FILE" 2>/dev/null; then
            echo "FAIL: ANSI escape sequences found in redirected stdout (should be empty or plain text)"
            cat "$STDOUT_FILE"
            rm -f "$STDOUT_FILE" "$STDERR_FILE"
            exit 1
          fi

          echo "PASS: TUI exits cleanly in non-TTY mode (exit 2, clear message, no ANSI leaks)"
          rm -f "$STDOUT_FILE" "$STDERR_FILE"

  # -----------------------------------------------------------------
  # TUI heap-soak regression gate — runs the quick profile (120 entries,
  # 2 plateau samples per width) and asserts the plateau slope stays
  # near zero and the mounted heap stays under a ceiling. Catches
  # renderer memory leaks before they reach production.
  # -----------------------------------------------------------------
  tui-heap-soak:
    name: TUI Heap Soak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      # Warm up workspace dist artifacts before the heap-soak benchmark
      # runs esbuild. The benchmark script imports entry points like
      # @wrongstack/tools/next-steps and @wrongstack/runtime/clipboard
      # which only exist as dist entries; without a build the esbuild
      # resolve step fails with "Could not resolve" before any memory
      # measurement can be taken. Building locally guarantees the
      # dist tree matches what production TUI users load.
      - name: Build workspace dist for heap-soak esbuild resolve
        run: pnpm -r build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run heap-soak benchmark (quick profile)
        run: pnpm bench:tui-heap --quick

      - name: Assert plateau slope and heap ceiling
        run: |
          node -e "
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('.reports/tui-heap-soak/report.json', 'utf8'));
            const MAX_SLOPE = 512 * 1024;   // 512 KiB/sample — real leaks show several MiB
            const MAX_HEAP  = 50 * 1024 * 1024; // 50 MiB — quick-profile baseline is ~15 MiB
            let failed = false;
            for (const s of report.scenarios) {
              const slope = s.run.memory.plateauSlopeBytesPerSample;
              const heap  = s.run.memory.mounted.heapUsed;
              const w     = s.run.scenario.width;
              console.log('width ' + w + ': slope=' + (slope/1024).toFixed(1) + ' KiB/sample, mounted=' + (heap/1024/1024).toFixed(2) + ' MiB');
              if (Math.abs(slope) > MAX_SLOPE) {
                console.error('FAIL: width ' + w + ' plateau slope ' + (slope/1024).toFixed(1) + ' KiB/sample exceeds ±' + (MAX_SLOPE/1024) + ' KiB threshold');
                failed = true;
              }
              if (heap > MAX_HEAP) {
                console.error('FAIL: width ' + w + ' mounted heap ' + (heap/1024/1024).toFixed(2) + ' MiB exceeds ' + (MAX_HEAP/1024/1024) + ' MiB ceiling');
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log('PASS: all scenarios within slope and heap thresholds');
          "

      - name: Upload heap-soak report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: ${{ !cancelled() }}
        with:
          name: tui-heap-soak-report
          path: |
            .reports/tui-heap-soak/report.json
            .reports/tui-heap-soak/report.md
          retention-days: 14

  # -----------------------------------------------------------------
  # Repo security scan (VF-20): run the repo's own analyzers against the
  # repo's own source — hardcoded secrets, unsafe dynamic execution, SQL
  # interpolation, prototype pollution, ReDoS-shaped regexes. Before this
  # job existed, only unit tests OF the scanners ran; nothing scanned the
  # repository itself.
  # -----------------------------------------------------------------
  security-scan:
    name: Security Scan (secrets + SAST)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      - name: Download verified build lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: .

      - name: Scan repo source (secrets + SAST)
        run: node scripts/ci-security-scan.mjs

  # -----------------------------------------------------------------
  # Security audit (pnpm audit)
  # Fails on moderate-or-higher advisories in production deps.
  # -----------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # 10m: npm's bulk-advisories endpoint has been slow/degraded (2026-09-04),
    # and the audit cannot finish inside 5m — the job died on this cap with
    # zero advisories ever evaluated, not on a real finding.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave GITHUB_TOKEN in .git/config: workspace postinstall
          # scripts run in this job and would be able to read it (WS-042).
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-08-01)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # VF-31 (security report Phase 4): lifecycle scripts must not run from
        # the in-repo pnpm-workspace.yaml allowBuilds during CI — a fork PR
        # can edit that allowlist in the same PR that CI executes. CI installs
        # with --ignore-scripts and rebuilds ONLY the reviewed native set,
        # pinned HERE in the workflow file. The workspace allowlist remains
        # the local-development source of truth; keeping the two in sync is a
        # review-time responsibility (build-allowlist-freshness.test.ts pins
        # the workspace side).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild reviewed native dependencies
        # Same reviewed set as pnpm-workspace.yaml allowBuilds. Additions here
        # require the same review bar documented at the top of that file.
        run: pnpm rebuild @biomejs/biome electron esbuild node-pty onnxruntime-node protobufjs sharp

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      # VF-35: website/ resolves from its own npm package-lock.json — audit
      # it here too so PR-time coverage matches the weekly audit workflow.
      - name: Audit website lockfile (npm)
        run: npm audit --prefix website --audit-level=moderate

  # Composite gate so branch-protection rules can require a single
  # status check rather than listing every job individually.
  gate:
    name: CI Gate
    needs: [lint, typecheck, build, manifests, plugin-guards, test, e2e, tui-smoke, tui-heap-soak, security-scan, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: All required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled."
          echo "  lint:          ${{ needs.lint.result }}"
          echo "  typecheck:     ${{ needs.typecheck.result }}"
          echo "  build:         ${{ needs.build.result }}"
          echo "  manifests:     ${{ needs.manifests.result }}"
          echo "  plugin-guards: ${{ needs.plugin-guards.result }}"
          echo "  test:          ${{ needs.test.result }}"
          echo "  e2e:           ${{ needs.e2e.result }}"
          echo "  tui-smoke:     ${{ needs.tui-smoke.result }}"
          echo "  tui-heap-soak: ${{ needs.tui-heap-soak.result }}"
          echo "  security-scan: ${{ needs.security-scan.result }}"
          echo "  audit:         ${{ needs.audit.result }}"
          exit 1
      - name: Gate passed
        if: "!(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))"
        run: echo "All gates passed."
