name: CI

# Monorepo gate: lint → typecheck → build → test.
# Runs on every push and PR to main; also dispatchable manually.
# Permissions are kept minimal — read-only repo access is sufficient
# because this workflow does not publish or deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one CI run per ref at a time. Cancel the older one so a rapid
# push sequence doesn't queue a backlog of stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm/action-setup v4 — resolves the correct pnpm version from
      # packageManager in root package.json. Tagged version is used here
      # because the SHA rotates with every patch; verify after first run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm biome lint .

  typecheck:
    name: TypeCheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace typecheck, serially to avoid tsc buildinfo contention.
      # Matches the root package.json script exactly.
      - name: TypeCheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test-inclusive TypeScript ratchet
        run: pnpm check:test-types

  build:
    name: Build (esbuild + tsc declarations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert clean artifact lineage
        run: pnpm check:clean-dist

      # Topological build via the centralized driver.
      # ESBuild for JS bundles, native tsc --emitDeclarationOnly for types.
      - name: Build
        run: pnpm build

      - name: Verify package contracts
        run: node scripts/check-package-contracts.mjs

      - name: Write artifact lineage manifest
        run: pnpm write:build-manifest

      - name: Upload verified build lineage
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: |
            .reports/build-artifact-manifest.json
            packages/*/dist
            apps/*/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (Vitest + 100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture and runtime-test inventory
        run: pnpm check:architecture && pnpm check:test-inventory && pnpm check:test-skips

      # Runs Node-package coverage first and WebUI's dedicated jsdom coverage
      # second. Both configs enforce 100% per production file.
      - name: Test with 100% coverage gate
        run: pnpm test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # hq-dashboard needs jsdom which the root forks pool can't resolve.
      # Run it from its package context so its own vitest config applies.
      - name: Test (hq-dashboard)
        run: pnpm --filter @wrongstack/cli exec vitest run tests/hq-dashboard.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # -----------------------------------------------------------------
  # E2E tests (Playwright)
  # Runs after the build so the global-setup can launch the WebUI
  # server against the compiled output. Serial execution because
  # the WebUI server binds to a single port.
  # -----------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: .

      - name: Verify artifact lineage
        run: pnpm check:build-manifest

      # Playwright browsers are cached to avoid re-downloading on every run.
      - name: Cache Playwright browsers
        uses: actions/cache@d4323d4df104b026a6aa6f6dfbed53dea3b2dfa3 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # -----------------------------------------------------------------
  # TUI smoke test — verifies --tui exits cleanly with code 2 and no
  # ANSI sequences when stdin is not a TTY (e.g. piped invocation).
  # Catches: raw-mode hangs, escape-sequence leaks to redirected stdout,
  # and SGR persistence after abnormal exit.
  # -----------------------------------------------------------------
  tui-smoke:
    name: TUI Smoke (non-TTY)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build lineage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wrongstack-build-${{ github.sha }}
          path: .

      - name: Verify artifact lineage
        run: pnpm check:build-manifest

      - name: Run TUI smoke test
        run: |
          # Redirect stdin from /dev/null so process.stdin.isTTY is false.
          # Redirect stdout to a temp file so we can scan it for ANSI escapes.
          # Exit code 2 is the documented non-TTY guard in run-tui.ts.
          STDOUT_FILE=$(mktemp)
          STDERR_FILE=$(mktemp)

          # Run with a bogus project dir so the TUI bails at the TTY check,
          # not at some other path (missing config, missing API key, etc.).
          EXIT_CODE=0
          node packages/cli/dist/index.js --tui --project . 2>"$STDERR_FILE" >"$STDOUT_FILE" || EXIT_CODE=$?

          echo "Exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "FAIL: TUI hung in non-TTY mode (timeout after 5s)"
            cat "$STDERR_FILE"
            rm -f "$STDOUT_FILE" "$STDERR_FILE"
            exit 1
          fi

          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "FAIL: Expected exit code 2, got $EXIT_CODE"
            echo "--- stderr ---"
            cat "$STDERR_FILE"
            echo "--- stdout ---"
            head -c 500 "$STDOUT_FILE"
            rm -f "$STDOUT_FILE" "$STDERR_FILE"
            exit 1
          fi

          # Verify stderr contains the user-facing non-TTY message.
          if ! grep -q "interactive terminal" "$STDERR_FILE"; then
            echo "FAIL: stderr does not contain expected non-TTY guidance message"
            cat "$STDERR_FILE"
            rm -f "$STDOUT_FILE" "$STDERR_FILE"
            exit 1
          fi

          # Verify stdout is clean — no ANSI escape sequences leaked to redirected output.
          # Pattern: ESC [ followed by any non-newline printable characters.
          if grep -Pq '\x1b\[[0-9;?]*[ -/]*[@-~]' "$STDOUT_FILE" 2>/dev/null; then
            echo "FAIL: ANSI escape sequences found in redirected stdout (should be empty or plain text)"
            cat "$STDOUT_FILE"
            rm -f "$STDOUT_FILE" "$STDERR_FILE"
            exit 1
          fi

          echo "PASS: TUI exits cleanly in non-TTY mode (exit 2, clear message, no ANSI leaks)"
          rm -f "$STDOUT_FILE" "$STDERR_FILE"

  # -----------------------------------------------------------------
  # Security audit (pnpm audit)
  # Fails on moderate-or-higher advisories in production deps.
  # -----------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  # Composite gate so branch-protection rules can require a single
  # status check rather than listing every job individually.
  gate:
    name: CI Gate
    needs: [lint, typecheck, build, test, e2e, tui-smoke, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: All required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled."
          echo "  lint:      ${{ needs.lint.result }}"
          echo "  typecheck: ${{ needs.typecheck.result }}"
          echo "  build:     ${{ needs.build.result }}"
          echo "  test:      ${{ needs.test.result }}"
          echo "  e2e:       ${{ needs.e2e.result }}"
          echo "  audit:     ${{ needs.audit.result }}"
          exit 1
      - name: Gate passed
        if: "!(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))"
        run: echo "All gates passed."
