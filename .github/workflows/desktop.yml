name: Desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    name: Package Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
          - os: macos-15
            target: --mac --arm64
          - os: macos-15-intel
            target: --mac --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild electron-winstaller esbuild node-pty
      - name: Package (no publishing credentials)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/package-desktop.mjs ${{ matrix.target }} --publish never
      - name: Check packaged dependencies and assets with Electron
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.mjs --window
      - name: Check Linux Desktop with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs --window
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name || format('desktop-{0}', github.run_id) }}-${{ matrix.os }}
          path: |
            apps/desktop/.package-stage/release/wrongstack-desktop-*.exe
            apps/desktop/.package-stage/release/wrongstack-desktop-*.dmg
            apps/desktop/.package-stage/release/wrongstack-desktop-*.zip
            apps/desktop/.package-stage/release/wrongstack-desktop-*.AppImage
            apps/desktop/.package-stage/release/wrongstack-desktop-*.deb
          if-no-files-found: error
          retention-days: 7
